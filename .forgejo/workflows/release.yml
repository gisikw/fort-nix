name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: nixos
    steps:
      - uses: actions/checkout@v4

      - name: Scan for PII
        run: |
          PII_DENYLIST='clusters/bedlam/pii-denylist.sops'

          if [ -f "$PII_DENYLIST" ]; then
            export SOPS_AGE_KEY="$CI_AGE_KEY"

            nix shell nixpkgs#sops -c sops -d --input-type binary --output-type binary "$PII_DENYLIST" > /tmp/pii-patterns.txt

            found=0
            while IFS= read -r pattern; do
              [ -z "$pattern" ] && continue
              [[ "$pattern" =~ ^# ]] && continue
              if grep -rliE "\b${pattern}\b" --include="*.nix" . 2>/dev/null; then
                echo "::error::PII pattern detected: $pattern"
                found=1
              fi
            done < /tmp/pii-patterns.txt
            rm -f /tmp/pii-patterns.txt

            if [ "$found" -eq 1 ]; then
              echo "::error::PII detected - blocking build"
              exit 1
            fi
            echo "PII scan passed"
          else
            echo "::warning::No PII denylist at $PII_DENYLIST"
          fi
        env:
          CI_AGE_KEY: ${{ secrets.CI_AGE_KEY }}

      - name: Run Go provider tests
        run: |
          for provider_dir in ./apps/*/provider ./aspects/*/provider; do
            if [ -d "$provider_dir" ] && [ -f "$provider_dir/go.mod" ]; then
              echo "::group::Testing $provider_dir"
              nix shell nixpkgs#go -c sh -c "cd $provider_dir && CGO_ENABLED=0 go test -v ./..."
              echo "::endgroup::"
            fi
          done

      - name: Check flakes
        run: |
          fail=0

          # Root flake
          nix flake check --no-build > /tmp/check-root.log 2>&1 &

          # Host flakes
          for host_dir in ./clusters/bedlam/hosts/*/; do
            host=$(basename "$host_dir")
            nix flake check "$host_dir" --no-build > "/tmp/check-host-${host}.log" 2>&1 &
          done

          # Device flakes
          for device_dir in ./clusters/bedlam/devices/*/; do
            device=$(basename "$device_dir")
            nix flake check "$device_dir" --no-build > "/tmp/check-device-${device}.log" 2>&1 &
          done

          for job in $(jobs -p); do
            if ! wait "$job"; then fail=1; fi
          done

          # Print results
          echo "::group::Root flake"
          cat /tmp/check-root.log
          echo "::endgroup::"
          for host_dir in ./clusters/bedlam/hosts/*/; do
            host=$(basename "$host_dir")
            echo "::group::Host: $host"
            cat "/tmp/check-host-${host}.log"
            echo "::endgroup::"
          done
          for device_dir in ./clusters/bedlam/devices/*/; do
            device=$(basename "$device_dir")
            echo "::group::Device: $device"
            cat "/tmp/check-device-${device}.log"
            echo "::endgroup::"
          done
          [ "$fail" -eq 0 ]
        env:
          NIX_CONFIG: "warn-dirty = false"

      # darwinConfigurations is not a standard flake output, so `nix flake
      # check` skips it entirely — evaluate darwin hosts explicitly so a
      # broken darwin eval fails CI like a broken NixOS eval does.
      - name: Evaluate darwin configurations
        run: |
          fail=0
          for host_dir in ./clusters/bedlam/hosts/*/; do
            host=$(basename "$host_dir")
            if nix flake show --json "$host_dir" 2>/dev/null | nix shell nixpkgs#jq -c jq -e '.darwinConfigurations' >/dev/null 2>&1; then
              echo "::group::Darwin host: $host"
              if ! nix eval --raw "$host_dir#darwinConfigurations.$host.config.system.build.toplevel.drvPath"; then
                fail=1
              fi
              echo ""
              echo "::endgroup::"
            fi
          done
          [ "$fail" -eq 0 ]
        env:
          NIX_CONFIG: "warn-dirty = false"

  deploy-obrien:
    needs: check
    if: github.event_name == 'push'
    runs-on: macos
    steps:
      - uses: actions/checkout@v4

      # obrien is the only Darwin host and cannot run the Linux gitops agent.
      # Converge it from its local runner so service fixes do not wait for a
      # manual SSH deployment (which left apple-dist down after host drift).
      - name: Deploy obrien
        run: |
          sudo /run/current-system/sw/bin/darwin-rebuild switch --flake ./clusters/bedlam/hosts/obrien#obrien
          # nix-darwin leaves an unchanged launchd job alone; explicitly
          # converge the distribution proxy in case launchd lost its job.
          sudo /bin/launchctl kickstart -k system/network.gisi.fort.nginx
          sleep 2
          curl --fail --silent --show-error --resolve apple.gisi.network:443:127.0.0.1 \
            https://apple.gisi.network/ -o /dev/null

          # A Darwin worker must use the scoped mesh resolver for VPN-only Fort
          # services. HTTP 401 is Drover's expected unauthenticated response and
          # proves DNS, routing, and TLS without exposing either bearer token.
          drover_status=
          for _ in $(seq 1 30); do
            drover_status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' https://drover.gisi.network/v1/machines || true)
            [ "$drover_status" = 401 ] && break
            sleep 1
          done
          if [ "$drover_status" != 401 ]; then
            echo "O'Brien cannot reach the authenticated Drover endpoint (HTTP $drover_status)" >&2
            dscacheutil -q host -a name drover.gisi.network >&2 || true
            exit 1
          fi

          # Confirm the isolated account sees the same resolver result. Resolver
          # changes do not alter the launchd plist, so explicitly restart the
          # existing worker and require initial enrollment state.
          echo "Drover resolution as admin:"
          dscacheutil -q host -a name drover.gisi.network
          echo "Drover resolution as drover-node:"
          sudo -u drover-node dscacheutil -q host -a name drover.gisi.network
          printf '\n--- deployment restart %s ---\n' "$(date -u +%FT%TZ)" \
            | sudo tee -a /var/log/drover-node.log >/dev/null
          sudo /bin/launchctl kickstart -k system/network.gisi.drover.node
          for _ in $(seq 1 30); do
            sudo test -s /var/lib/drover-node/state/identity.json && break
            sleep 1
          done
          if ! sudo test -s /var/lib/drover-node/state/identity.json; then
            sudo /bin/launchctl print system/network.gisi.drover.node >&2 || true
            sudo tail -100 /var/log/drover-node.log >&2 || true
            exit 1
          fi

          sudo mkdir -p /var/lib/fort-gitops
          git rev-parse --short HEAD | sudo tee /var/lib/fort-gitops/deployed-commit >/dev/null

  mirror:
    needs: check
    if: github.event_name == 'push'
    runs-on: nixos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitHub mirror
        run: |
          REPO_URL="https://${MIRROR_TOKEN}@github.com/gisikw/fort-nix.git"
          GIT_TERMINAL_PROMPT=0 git push --force "$REPO_URL" main:main
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
